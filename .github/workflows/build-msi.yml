name: AP-BIM 2.4.1 Windows CI qualification
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  ap-ribbon:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.110'
      - name: Extract AP-BIM Tools source bundle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path '.\AP-BIM-Tools-v2.0-MSI-BuildReady.zip')) { throw 'AP-BIM-Tools-v2.0-MSI-BuildReady.zip was not found in repository root.' }
          Remove-Item '.\_ap_source' -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive '.\AP-BIM-Tools-v2.0-MSI-BuildReady.zip' '.\_ap_source' -Force
          Copy-Item '.\_ap_source\AP-BIM-Tools\*' '.\' -Recurse -Force

          function Expand-GzipBase64([string]$inputPath, [string]$outputPath) {
            $bytes = [Convert]::FromBase64String((Get-Content $inputPath -Raw).Trim())
            $memory = New-Object IO.MemoryStream(,$bytes)
            $gzip = New-Object IO.Compression.GzipStream($memory, [IO.Compression.CompressionMode]::Decompress)
            $file = [IO.File]::Create($ExecutionContext.SessionState.Path.GetUnresolvedProviderPathFromPSPath($outputPath))
            $gzip.CopyTo($file)
            $file.Dispose(); $gzip.Dispose(); $memory.Dispose()
          }

          Expand-GzipBase64 '.\.ci\v21.patch.gz.b64' '.\.ci\v21.patch'
          git apply --whitespace=nowarn '.\.ci\v21.patch'
          Expand-GzipBase64 '.\.ci\v21-icons.ps1.gz.b64' '.\.ci\v21-icons.ps1'
          & '.\.ci\v24-ribbon-fix.ps1' -Phase BeforeLegacyScripts
          & '.\.ci\v21-icons.ps1'
          & '.\.ci\fix-v211-icons.ps1'
          & '.\.ci\v22-component-menu.ps1'
          & '.\.ci\v22-icons.ps1'

          $payloadB64 = (Get-Content '.\.ci\v23payload\part00.txt' -Raw) +
                        (Get-Content '.\.ci\v23payload\part01.txt' -Raw) +
                        (Get-Content '.\.ci\v23payload\part02.txt' -Raw) +
                        (Get-Content '.\.ci\v23payload\part03.txt' -Raw) +
                        (Get-Content '.\.ci\v23payload\part04.txt' -Raw)
          $payloadBytes = [Convert]::FromBase64String(($payloadB64 -replace '\\s',''))
          [IO.File]::WriteAllBytes((Join-Path (Get-Location).Path '.ci\v23-files.tar.gz'), $payloadBytes)
          tar -xzf '.\.ci\v23-files.tar.gz' -C '.'
          & '.\.ci\v24-ribbon-fix.ps1' -Phase AfterPayloadExtract
          & '.\.ci\v23-fix.ps1'
          & '.\.ci\v24-ribbon-fix.ps1' -Phase Finalize

          dotnet --info

      - name: Build Revit 2023
        shell: powershell
        run: dotnet build .\AP-BIM-Tools.slnx -c Release.R23 -p:DeployAddin=false -p:LaunchRevit=false

      - name: Build Revit 2024
        shell: powershell
        run: dotnet build .\AP-BIM-Tools.slnx -c Release.R24 -p:DeployAddin=false -p:LaunchRevit=false

      - name: Build Revit 2025
        shell: powershell
        run: dotnet build .\AP-BIM-Tools.slnx -c Release.R25 -p:DeployAddin=false -p:LaunchRevit=false

      - name: Build Revit 2026
        shell: powershell
        run: dotnet build .\AP-BIM-Tools.slnx -c Release.R26 -p:DeployAddin=false -p:LaunchRevit=false

      - name: Build Revit 2027
        shell: powershell
        run: dotnet build .\AP-BIM-Tools.slnx -c Release.R27 -p:DeployAddin=false -p:LaunchRevit=false


      - name: Qualification summary
        shell: powershell
        run: |
          "AP ribbon compilation only; CAD Export not packaged. No release MSI produced." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
  sdk-preflight:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.110'
      - name: Check Windows build tools
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          dotnet --list-sdks
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Microsoft SDKs\Windows'
          $tlbimp = Get-ChildItem -Path $sdk -Filter TlbImp.exe -Recurse -File | Where-Object {$_.DirectoryName -match '\\x64$'} | Select-Object -First 1
          if (!$tlbimp) { throw 'TlbImp x64 missing' }
          $tlbimp.FullName
          dotnet tool install wix --version 7.0.1 --tool-path (Join-Path $env:RUNNER_TEMP 'ap-wix')
          if($LASTEXITCODE -ne 0){throw 'WiX restore failed'}
      - name: Validate ObjectARX 2021 download and references
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $sdkDir=Join-Path $env:RUNNER_TEMP 'ObjectARX2021'
          New-Item -ItemType Directory $sdkDir -Force | Out-Null
          $archive=Join-Path $env:RUNNER_TEMP 'ObjectARX2021.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://download.autodesk.com/esd/objectarx/2021/objectarx_for_autocad_2021_win_64bit_dlm.sfx.exe' -OutFile $archive
          & 7z.exe x -y ("-o"+$sdkDir) $archive
          if($LASTEXITCODE -ne 0){throw 'SDK extraction failed'}
          foreach($name in 'acmgd.dll','acdbmgd.dll','accoremgd.dll','AcSmComponents24.tlb'){
            $f=Get-ChildItem -LiteralPath $sdkDir -Filter $name -Recurse -File | Select-Object -First 1
            if(!$f){throw "SDK reference missing: $name"}
            Write-Host ("SDK reference found: "+$f.Name+" ("+$f.Length+" bytes)")
          }
          "SDK reference preflight passed; no Autodesk DLLs uploaded." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
