name: Build AP-BIM Tools MSI

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths:
      - 'AP-BIM-Tools-v2.0-MSI-BuildReady.zip'
      - '.github/workflows/build-msi.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.110'

      - name: Extract AP-BIM Tools source bundle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path '.\AP-BIM-Tools-v2.0-MSI-BuildReady.zip')) { throw 'AP-BIM-Tools-v2.0-MSI-BuildReady.zip was not found in repository root.' }
          Remove-Item '.\_ap_source' -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive '.\AP-BIM-Tools-v2.0-MSI-BuildReady.zip' '.\_ap_source' -Force
          Copy-Item '.\_ap_source\AP-BIM-Tools\*' '.\' -Recurse -Force

          function Expand-GzipBase64([string]$inputPath, [string]$outputPath) {
            $bytes = [Convert]::FromBase64String((Get-Content $inputPath -Raw).Trim())
            $memory = New-Object IO.MemoryStream(,$bytes)
            $gzip = New-Object IO.Compression.GzipStream($memory, [IO.Compression.CompressionMode]::Decompress)
            $file = [IO.File]::Create($outputPath)
            $gzip.CopyTo($file)
            $file.Dispose(); $gzip.Dispose(); $memory.Dispose()
          }

          Expand-GzipBase64 '.\.ci\v21.patch.gz.b64' '.\.ci\v21.patch'
          git apply --whitespace=nowarn '.\.ci\v21.patch'
          Expand-GzipBase64 '.\.ci\v21-icons.ps1.gz.b64' '.\.ci\v21-icons.ps1'
          & '.\.ci\v21-icons.ps1'
          & '.\.ci\fix-v211-icons.ps1'
          & '.\.ci\v22-component-menu.ps1'
          & '.\.ci\v22-icons.ps1'
          dotnet --info

      - name: Build Revit 2023
        shell: powershell
        run: dotnet build .\AP-BIM-Tools.slnx -c Release.R23

      - name: Build Revit 2024
        shell: powershell
        run: dotnet build .\AP-BIM-Tools.slnx -c Release.R24

      - name: Build Revit 2025
        shell: powershell
        run: dotnet build .\AP-BIM-Tools.slnx -c Release.R25

      - name: Build Revit 2026
        shell: powershell
        run: dotnet build .\AP-BIM-Tools.slnx -c Release.R26

      - name: Build Revit 2027
        shell: powershell
        run: dotnet build .\AP-BIM-Tools.slnx -c Release.R27

      - name: Build MSI
        shell: powershell
        run: |
          dotnet tool install wix --version '7.*' --tool-path .\.wix
          $wix = (Resolve-Path '.\.wix\wix.exe').Path
          & $wix eula accept wix7
          $wixVersion = (Get-Item $wix).VersionInfo.FileVersion
          & $wix extension add -g "WixToolset.UI.wixext/$wixVersion"
          $env:PATH = "$(Resolve-Path '.\.wix');$env:PATH"
          dotnet run --project .\install\Installer.csproj -- 2.2.0 '.\source\AP.BimTools\bin\publish\2023' '.\source\AP.BimTools\bin\publish\2024' '.\source\AP.BimTools\bin\publish\2025' '.\source\AP.BimTools\bin\publish\2026' '.\source\AP.BimTools\bin\publish\2027'

      - name: Verify MSI
        shell: powershell
        run: |
          Get-ChildItem '.\output\*.msi' | Format-Table Name, Length, LastWriteTime
          if (!(Test-Path '.\output\AP-BIM-Tools-2.2.0.msi')) { throw 'Expected MSI was not created.' }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AP-BIM-Tools-2.2.0-MSI
          path: output/AP-BIM-Tools-2.2.0.msi
          if-no-files-found: error

      - name: Upload Revit publish folders
        uses: actions/upload-artifact@v4
        with:
          name: AP-BIM-Tools-2.2.0-Publish
          path: source/AP.BimTools/bin/publish/**
          if-no-files-found: warn
